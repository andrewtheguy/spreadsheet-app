[package]
name = "spreadsheet-app"
version = "0.0.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spreadsheet_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.16", features = [] }

[dependencies]
# Experimental embedded Chromium (CEF) runtime instead of the default system webview (WRY).
# `cef` is mutually exclusive with the default `wry` feature, so defaults are disabled.
tauri = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.16", default-features = false, features = ["cef"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Pure CSV parsing, serializing, and row-matching logic, kept Tauri-free so it tests fast.
sheet-core = { path = "sheet-core" }
# Standalone native file dialog. We deliberately avoid `tauri-plugin-dialog` because it
# would pull a crates.io `tauri` that conflicts with the git (cef alpha) `tauri` we build
# against, producing duplicate-crate trait mismatches.
# Default features are Linux-only portal/async support,
# which this macOS/Windows CSV app does not need.
rfd = { version = "0.15", default-features = false }
# `shellexecute-on-windows` makes `open::that_detached` use ShellExecuteExW instead of
# `cmd /c start`, avoiding shell command injection when opening external URLs.
open = { version = "5", features = ["shellexecute-on-windows"] }

# `src-tauri` is the workspace root; `sheet-core` is its only extra member.
[workspace]
members = ["sheet-core"]
resolver = "2"

