<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21A366"/>
      <stop offset="1" stop-color="#107C41"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33C481"/>
      <stop offset="1" stop-color="#21A366"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect x="64" y="64" width="896" height="896" rx="180" fill="url(#bg)"/>

  <!-- Spreadsheet sheet -->
  <g filter="url(#shadow)">
    <rect x="232" y="220" width="560" height="584" rx="40" fill="#FFFFFF"/>
  </g>

  <!-- Column header band -->
  <path d="M232 260 a40 40 0 0 1 40 -40 h480 a40 40 0 0 1 40 40 v60 h-560 z" fill="url(#header)"/>

  <!-- Grid lines (rows) -->
  <g stroke="#D4E9DC" stroke-width="8" stroke-linecap="round">
    <line x1="252" y1="416" x2="772" y2="416"/>
    <line x1="252" y1="512" x2="772" y2="512"/>
    <line x1="252" y1="608" x2="772" y2="608"/>
    <line x1="252" y1="704" x2="772" y2="704"/>
  </g>
  <!-- Grid lines (columns) -->
  <g stroke="#D4E9DC" stroke-width="8" stroke-linecap="round">
    <line x1="426" y1="340" x2="426" y2="784"/>
    <line x1="599" y1="340" x2="599" y2="784"/>
  </g>

  <!-- Highlighted cells to evoke data / processing -->
  <rect x="262" y="346" width="148" height="58" rx="10" fill="#21A366" opacity="0.85"/>
  <rect x="615" y="442" width="148" height="58" rx="10" fill="#33C481" opacity="0.55"/>
  <rect x="262" y="634" width="148" height="58" rx="10" fill="#107C41" opacity="0.5"/>
  <rect x="442" y="538" width="148" height="58" rx="10" fill="#21A366" opacity="0.3"/>
</svg>
