name: release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Let the gh CLI resolve the repo/token in jobs without a checkout.
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    name: Create draft prerelease
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Compute release tag
        id: meta
        run: |
          set -euo pipefail
          # yyyymmddhhmmss (UTC) + short git sha from the GITHUB_SHA env variable.
          TAG="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create draft prerelease
        id: release
        run: |
          set -euo pipefail
          # Create via the API so the response gives us the numeric release id directly.
          # A draft release has no git tag yet, so it can't be looked up via
          # `releases/tags/{tag}` (that endpoint only matches published releases).
          # The upload step below addresses it by that numeric id.
          RELEASE_ID=$(gh api -X POST "repos/$GH_REPO/releases" \
            -f tag_name="${{ steps.meta.outputs.tag }}" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="${{ steps.meta.outputs.tag }}" \
            -F draft=true \
            -F prerelease=true \
            -F generate_release_notes=true \
            --jq '.id')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Created draft release id=$RELEASE_ID"

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # Universal binary, so one .dmg covers Apple silicon and Intel.
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to point at
      # different code, and these run with a token that can write releases. The trailing
      # comment is the release each SHA is, so Dependabot (.github/dependabot.yml) can
      # bump both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `stable` is a branch here rather than a release tag, so this pins the action's own
      # code as of that commit. It still installs whatever the current stable Rust is —
      # that's resolved at run time and isn't what the pin freezes.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          targets: ${{ matrix.targets }}

      - name: rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          MAKE_DMG=1 ./scripts/bundle-macos.sh target/macos \
            target/aarch64-apple-darwin/release/spreadsheet-app \
            target/x86_64-apple-darwin/release/spreadsheet-app
          # Ship the .app too, so the DMG isn't the only way to get it.
          ditto -c -k --keepParent target/macos/spreadsheet-app.app \
            target/macos/spreadsheet-app-macos.zip

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          $exe = "target/x86_64-pc-windows-msvc/release/spreadsheet-app.exe"
          # MSI installer (Start Menu entry, Add/Remove Programs, in-place upgrades).
          ./scripts/bundle-windows.ps1 -ExePath $exe -OutDir dist
          # Plus the bare .exe, for anyone who'd rather not run an installer.
          Compress-Archive -Force -Path $exe `
            -DestinationPath dist/spreadsheet-app-windows-x86_64.zip

      - name: Upload artifacts to the draft release
        shell: bash
        run: |
          set -euo pipefail
          # `gh release upload` addresses releases by tag, which a draft doesn't have yet, so
          # upload against the numeric release id instead.
          upload() {
            local file=$1
            echo "Uploading $(basename "$file")"
            curl --fail-with-body -sSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/$GH_REPO/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$(basename "$file")" \
              > /dev/null
          }
          if [ "$RUNNER_OS" = "macOS" ]; then
            for f in target/macos/*.dmg target/macos/*.zip; do upload "$f"; done
          else
            for f in dist/*.msi dist/*.zip; do upload "$f"; done
          fi

  publish:
    name: Publish prerelease
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish prerelease
        # Edit by numeric id (the release is still a draft, so it has no tag to resolve).
        # Flipping draft=false creates the git tag and publishes it as a prerelease.
        run: |
          gh api -X PATCH "repos/$GH_REPO/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false \
            -F prerelease=true
