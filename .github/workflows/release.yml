name: release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Let the gh CLI resolve the repo/token in jobs without a checkout.
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    name: Create draft prerelease
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Compute release tag
        id: meta
        run: |
          set -euo pipefail
          # yyyymmddhhmmss (UTC) + short git sha from the GITHUB_SHA env variable.
          TAG="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create draft prerelease
        id: release
        run: |
          set -euo pipefail
          # Create via the API so the response gives us the numeric release id directly.
          # A draft release has no git tag yet, so it can't be looked up via
          # `releases/tags/{tag}` (that endpoint only matches published releases).
          # tauri-action uploads by that numeric id.
          RELEASE_ID=$(gh api -X POST "repos/$GH_REPO/releases" \
            -f tag_name="${{ steps.meta.outputs.tag }}" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="${{ steps.meta.outputs.tag }}" \
            -F draft=true \
            -F prerelease=true \
            -F generate_release_notes=true \
            --jq '.id')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Created draft release id=$RELEASE_ID"

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # app + dmg only; excludes the `updater` target (the `.app.tar.gz`).
            args: '--bundles app,dmg'
          - platform: windows-latest
            # Only build the MSI installer (overrides `targets: "all"` in tauri.conf.json).
            args: '--bundles msi'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: bun install

      # Builds the CEF Tauri app via the cli-cef CLI (the `tauri` script) and
      # uploads the bundles to the draft prerelease created above.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

  publish:
    name: Publish prerelease
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish prerelease
        # Edit by numeric id (the release is still a draft, so it has no tag to resolve).
        # Flipping draft=false creates the git tag and publishes it as a prerelease.
        run: |
          gh api -X PATCH "repos/$GH_REPO/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false \
            -F prerelease=true
