[package]
name = "sheet-core"
version = "0.0.6"
edition = "2021"

# Pure CSV parsing, serializing, and row-matching logic with no Tauri/CEF dependencies, so
# it builds and tests in isolation and in seconds (`cargo test -p sheet-core`).
[lib]
name = "sheet_core"

[dependencies]
calamine = "0.36.1"
csv = "1"
serde = { version = "1", features = ["derive"] }
# Read xlsx number-format codes ourselves (calamine drops them): unzip the package and parse
# styles.xml + the sheet. Both crates are already in the tree via calamine; matching its zip
# features avoids pulling extra compression backends.
zip = { version = "7", default-features = false, features = ["deflate"] }
quick-xml = "0.39"

[dev-dependencies]
rust_xlsxwriter = "0.95.0"
